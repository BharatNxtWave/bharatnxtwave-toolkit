# BharatNXT Wave - Render Blueprint
#
# Create the whole stack from this file: Render Dashboard -> New -> Blueprint,
# point it at this repository. See deployment/DEPLOY_RENDER.md for the full
# walkthrough and for the values you must fill in yourself.
#
# Two things here are NOT optional:
#
#   disk:            Render wipes the container filesystem on every deploy.
#                    Scheme flyers live on this disk. Without it they are
#                    lost on the next deploy, silently - the files vanish
#                    while their database rows remain.
#
#   healthCheckPath: the office IP allow-list would otherwise reject
#                    Render's health probe and fail every deploy.
#
# For a throwaway team-testing deployment on the free tier, use
# deployment/render.free.yaml instead - see DEPLOY_RENDER.md section 0b.

databases:
  - name: bharatnxt-db
    databaseName: bharatnxt_toolkit
    user: bharatnxt_app
    # Must match the web service region, or every query crosses the internet.
    region: singapore
    # Sized for the connection count, not the data: every gunicorn worker
    # holds its own persistent connection (CONN_MAX_AGE=60). numInstances x
    # WEB_CONCURRENCY + the import worker must fit the plan's limit.
    plan: basic-1gb
    postgresMajorVersion: "16"
    ipAllowList: []          # Reachable only from inside Render.

services:
  # Shared cache. Required once there is more than one instance: it holds the
  # cached search answers (toolkit/search_cache.py) and the login lockout
  # counters, both of which must be seen by every worker on every instance.
  # Without it the app falls back to the database cache, which puts the load
  # back on the database that the search cache exists to remove.
  #
  # Render renamed this service type; if the dashboard rejects `redis`, use
  # the current Key Value type and keep the same name.
  - type: redis
    name: bharatnxt-cache
    region: singapore
    plan: starter
    maxmemoryPolicy: allkeys-lru   # It is a cache; evicting is correct.
    ipAllowList: []

  # Applies queued imports and rollbacks. Both take a full pg_dump and rewrite
  # the catalogue, which used to run inside the HTTP request - blocking a
  # gunicorn worker and hitting the 120s request timeout as the database grew.
  #
  # Safe to run more than one: batches are claimed with a single conditional
  # UPDATE. Safe to run none: imports simply wait in the queue.
  - type: worker
    name: bharatnxt-import-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    dockerCommand: python manage.py run_import_worker

    # The worker serves no HTTP, so it needs no hosts, CSRF origins or
    # office allow-list. It does need the same database, the same disk (it
    # writes pre-import snapshots there) and the same cache.
    #
    # The secret key is pulled from the web service rather than generated
    # again, so both halves of the app agree on one value.
    envVars:
      - key: BHARATNXT_ENVIRONMENT
        value: production

      - key: BHARATNXT_SECRET_KEY
        fromService:
          type: web
          name: bharatnxt-toolkit
          envVarKey: BHARATNXT_SECRET_KEY

      - key: DATABASE_URL
        fromDatabase:
          name: bharatnxt-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: bharatnxt-cache
          property: connectionString

      - key: BHARATNXT_DATA_ROOT
        value: /var/data

      - key: BHARATNXT_LOG_LEVEL
        value: INFO

    # Pre-import snapshots are written here, so the worker needs the disk
    # too. Render mounts a disk to one service, so this is a separate disk
    # from the web service's - snapshots written here are not visible from
    # the web instances. They are an audit artefact, not something the app
    # reads back, so that is acceptable.
    disk:
      name: bharatnxt-worker-data
      mountPath: /var/data
      sizeGB: 10

  - type: web
    name: bharatnxt-toolkit
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    # A persistent disk requires a paid instance type; free will not work.
    # `standard` is sized for the worker count below - each gunicorn worker
    # holds about 75 MB steady state (measured), so 8 workers needs roughly
    # 600 MB plus headroom.
    plan: standard
    numInstances: 2
    healthCheckPath: /healthz/

    disk:
      name: bharatnxt-data
      mountPath: /var/data
      sizeGB: 10

    envVars:
      # -- the master switch ------------------------------------------------
      # Turns off DEBUG and turns on HTTPS enforcement, secure cookies and
      # the office IP allow-list. The container refuses to start without it.
      - key: BHARATNXT_ENVIRONMENT
        value: production

      # -- secrets ----------------------------------------------------------
      # Generated once by Render and then held; never in the repository.
      - key: BHARATNXT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: bharatnxt-db
          property: connectionString

      # -- persistent storage -----------------------------------------------
      # Must equal the disk mountPath above.
      - key: BHARATNXT_DATA_ROOT
        value: /var/data

      # -- how the client IP is resolved ------------------------------------
      # On Render REMOTE_ADDR is an internal address, so the client comes
      # from X-Forwarded-For instead. Verify the hop count against a real
      # request before trusting the allow-list - DEPLOY_RENDER.md step 6
      # explains how.
      - key: BHARATNXT_PROXY_MODE
        value: forwarded

      - key: BHARATNXT_TRUSTED_PROXY_HOPS
        value: "1"

      # -- fill these in yourself -------------------------------------------
      # sync: false means Render prompts for the value and keeps it out of
      # this file.

      # The office's PUBLIC egress IP in CIDR form, e.g. 203.0.113.5/32.
      # NOT the office LAN range - Render never sees LAN addresses.
      # Get it from the office network with: curl https://ifconfig.me
      - key: BHARATNXT_OFFICE_NETWORKS
        sync: false

      # An unguessable path for Django's built-in admin, or an empty string
      # to remove it. It grants direct model access, so do not leave /admin/.
      - key: BHARATNXT_DJANGO_ADMIN_PATH
        sync: false

      # Optional. The service's own .onrender.com hostname is added
      # automatically; set these only when using a custom domain.
      - key: BHARATNXT_ALLOWED_HOSTS
        sync: false

      - key: BHARATNXT_CSRF_TRUSTED_ORIGINS
        sync: false

      # -- tunable ----------------------------------------------------------
      - key: BHARATNXT_LOGIN_MAX_ATTEMPTS
        value: "5"

      - key: BHARATNXT_LOGIN_LOCKOUT_SECONDS
        value: "900"

      - key: BHARATNXT_LOG_LEVEL
        value: INFO

      # gunicorn uses sync workers: each one serves a single request at a
      # time, so this is the concurrency ceiling per instance. 8 workers x 2
      # instances = 16 requests in flight.
      #
      # Raise only alongside the instance size (about 75 MB per worker) and
      # the database plan (one persistent connection per worker).
      - key: WEB_CONCURRENCY
        value: "8"

      # Shared cache. Without it the app uses the database cache, which does
      # not scale past a single small instance.
      - key: REDIS_URL
        fromService:
          type: redis
          name: bharatnxt-cache
          property: connectionString
